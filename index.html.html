<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zeppolimo</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
    }

    body {
      position: relative;
    }

    .logo {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(760px, 92vw);
      height: auto;
      display: block;
      z-index: 1;
    }

    .dog-wrap {
      position: absolute;
      left: 0;
      top: 0;
      width: clamp(110px, 15vw, 210px);
      z-index: 2;
      pointer-events: none;
      animation: roam 16s linear infinite;
      will-change: transform;
    }

    .dog {
      width: 100%;
      height: auto;
      display: block;
      transform-origin: 50% 90%;
      animation: bounce 0.75s ease-in-out infinite alternate;
      filter: drop-shadow(0 8px 7px rgba(0,0,0,.18));
      will-change: transform;
    }

    @keyframes bounce {
      0%   { transform: translateY(0) rotate(-5deg) scale(1); }
      50%  { transform: translateY(-28px) rotate(5deg) scale(1.04); }
      100% { transform: translateY(0) rotate(-2deg) scale(.99); }
    }

    @keyframes roam {
      0%   { transform: translate(2vw, 72vh) scaleX(1); }
      10%  { transform: translate(16vw, 58vh) scaleX(1); }
      22%  { transform: translate(34vw, 76vh) scaleX(1); }
      36%  { transform: translate(58vw, 48vh) scaleX(1); }
      48%  { transform: translate(78vw, 68vh) scaleX(1); }
      50%  { transform: translate(78vw, 68vh) scaleX(-1); }
      62%  { transform: translate(60vw, 18vh) scaleX(-1); }
      74%  { transform: translate(38vw, 32vh) scaleX(-1); }
      88%  { transform: translate(14vw, 16vh) scaleX(-1); }
      100% { transform: translate(2vw, 72vh) scaleX(-1); }
    }

    @media (max-width: 600px) {
      .dog-wrap {
        width: clamp(95px, 27vw, 145px);
        animation-duration: 14s;
      }

      @keyframes roam {
        0%   { transform: translate(2vw, 75vh) scaleX(1); }
        12%  { transform: translate(20vw, 58vh) scaleX(1); }
        28%  { transform: translate(52vw, 74vh) scaleX(1); }
        42%  { transform: translate(70vw, 46vh) scaleX(1); }
        50%  { transform: translate(72vw, 46vh) scaleX(-1); }
        64%  { transform: translate(50vw, 15vh) scaleX(-1); }
        80%  { transform: translate(22vw, 30vh) scaleX(-1); }
        100% { transform: translate(2vw, 75vh) scaleX(-1); }
      }
    }
  </style>
</head>
<body>
  <img class="logo" src="zeppolimo-logo.jpeg" alt="Zeppolimo Logo mit Hinky und Pinky">
  <div class="dog-wrap" aria-hidden="true">
    <img class="dog" src="zeppolimo-hund.png" alt="">
  </div>
</body>
</html>
