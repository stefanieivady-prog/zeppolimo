<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zeppolimo</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #6e2e54;
    }

    body {
      position: relative;
    }

    /* =========================================================
       PRICKELNDE LIMONADE IM HINTERGRUND
       ========================================================= */

    .bubbles {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .bubble {
      position: absolute;
      bottom: -80px;
      border: 2px solid rgba(244, 207, 73, .48);
      background: rgba(255, 232, 128, .16);
      border-radius: 50%;
      box-shadow:
        inset -3px -4px 8px rgba(244, 207, 73, .10),
        inset 3px 3px 7px rgba(255, 245, 190, .28);
      animation: rise linear infinite;
    }

    .bubble::after {
      content: "";
      position: absolute;
      width: 28%;
      height: 28%;
      left: 18%;
      top: 14%;
      border-radius: 50%;
      background: rgba(255, 239, 166, .34);
    }

    @keyframes rise {
      0% {
        transform: translate3d(0, 0, 0) scale(.75);
        opacity: 0;
      }

      8% {
        opacity: .85;
      }

      45% {
        transform: translate3d(18px, -52vh, 0) scale(.92);
      }

      78% {
        opacity: .72;
      }

      100% {
        transform: translate3d(-12px, -115vh, 0) scale(1.08);
        opacity: 0;
      }
    }

    .bubble:nth-child(1)  { left: 5%;  width: 18px; height: 18px; animation-duration: 8s;  animation-delay: -2s; }
    .bubble:nth-child(2)  { left: 13%; width: 38px; height: 38px; animation-duration: 13s; animation-delay: -8s; }
    .bubble:nth-child(3)  { left: 21%; width: 12px; height: 12px; animation-duration: 7s;  animation-delay: -5s; }
    .bubble:nth-child(4)  { left: 29%; width: 27px; height: 27px; animation-duration: 11s; animation-delay: -1s; }
    .bubble:nth-child(5)  { left: 37%; width: 52px; height: 52px; animation-duration: 16s; animation-delay: -11s; }
    .bubble:nth-child(6)  { left: 45%; width: 15px; height: 15px; animation-duration: 9s;  animation-delay: -4s; }
    .bubble:nth-child(7)  { left: 53%; width: 32px; height: 32px; animation-duration: 12s; animation-delay: -7s; }
    .bubble:nth-child(8)  { left: 61%; width: 20px; height: 20px; animation-duration: 8s;  animation-delay: -6s; }
    .bubble:nth-child(9)  { left: 69%; width: 46px; height: 46px; animation-duration: 15s; animation-delay: -3s; }
    .bubble:nth-child(10) { left: 77%; width: 13px; height: 13px; animation-duration: 7s;  animation-delay: -2s; }
    .bubble:nth-child(11) { left: 84%; width: 29px; height: 29px; animation-duration: 11s; animation-delay: -9s; }
    .bubble:nth-child(12) { left: 92%; width: 55px; height: 55px; animation-duration: 17s; animation-delay: -13s; }
    .bubble:nth-child(13) { left: 17%; width: 23px; height: 23px; animation-duration: 10s; animation-delay: -9s; }
    .bubble:nth-child(14) { left: 34%; width: 10px; height: 10px; animation-duration: 6s;  animation-delay: -3s; }
    .bubble:nth-child(15) { left: 57%; width: 41px; height: 41px; animation-duration: 14s; animation-delay: -12s; }
    .bubble:nth-child(16) { left: 73%; width: 17px; height: 17px; animation-duration: 9s;  animation-delay: -7s; }
    .bubble:nth-child(17) { left: 88%; width: 25px; height: 25px; animation-duration: 12s; animation-delay: -4s; }
    .bubble:nth-child(18) { left: 3%;  width: 11px; height: 11px; animation-duration: 7s;  animation-delay: -1s; }
    .bubble:nth-child(19) { left: 9%;  width: 31px; height: 31px; animation-duration: 12s; animation-delay: -6s; }
    .bubble:nth-child(20) { left: 15%; width: 16px; height: 16px; animation-duration: 9s;  animation-delay: -3s; }
    .bubble:nth-child(21) { left: 24%; width: 44px; height: 44px; animation-duration: 15s; animation-delay: -10s; }
    .bubble:nth-child(22) { left: 31%; width: 13px; height: 13px; animation-duration: 8s;  animation-delay: -5s; }
    .bubble:nth-child(23) { left: 39%; width: 26px; height: 26px; animation-duration: 11s; animation-delay: -8s; }
    .bubble:nth-child(24) { left: 47%; width: 9px;  height: 9px;  animation-duration: 6s;  animation-delay: -2s; }
    .bubble:nth-child(25) { left: 55%; width: 36px; height: 36px; animation-duration: 13s; animation-delay: -9s; }
    .bubble:nth-child(26) { left: 63%; width: 18px; height: 18px; animation-duration: 9s;  animation-delay: -4s; }
    .bubble:nth-child(27) { left: 71%; width: 48px; height: 48px; animation-duration: 16s; animation-delay: -12s; }
    .bubble:nth-child(28) { left: 79%; width: 12px; height: 12px; animation-duration: 7s;  animation-delay: -5s; }
    .bubble:nth-child(29) { left: 87%; width: 30px; height: 30px; animation-duration: 12s; animation-delay: -7s; }
    .bubble:nth-child(30) { left: 95%; width: 17px; height: 17px; animation-duration: 9s;  animation-delay: -3s; }
    .bubble:nth-child(31) { left: 7%;  width: 42px; height: 42px; animation-duration: 14s; animation-delay: -11s; }
    .bubble:nth-child(32) { left: 19%; width: 8px;  height: 8px;  animation-duration: 6s;  animation-delay: -4s; }
    .bubble:nth-child(33) { left: 43%; width: 22px; height: 22px; animation-duration: 10s; animation-delay: -6s; }
    .bubble:nth-child(34) { left: 59%; width: 14px; height: 14px; animation-duration: 8s;  animation-delay: -7s; }
    .bubble:nth-child(35) { left: 68%; width: 34px; height: 34px; animation-duration: 13s; animation-delay: -10s; }
    .bubble:nth-child(36) { left: 82%; width: 10px; height: 10px; animation-duration: 7s;  animation-delay: -1s; }
    .bubble:nth-child(37) { left: 91%; width: 39px; height: 39px; animation-duration: 14s; animation-delay: -8s; }


    /* =========================================================
       ZEPPO HAUPTLOGO
       ========================================================= */

    .logo {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(650px, 72vw);
      height: auto;
      display: block;
      z-index: 1;
    }


    /* =========================================================
       HUND
       ========================================================= */

    .dog-wrap {
      position: absolute;
      left: 0;
      top: 0;
      width: clamp(110px, 15vw, 210px);
      z-index: 20;
      pointer-events: none;
      animation: roam 16s linear infinite;
      will-change: transform;
    }

    .dog {
      width: 100%;
      height: auto;
      display: block;
      transform-origin: 50% 90%;
      animation: bounce 0.75s ease-in-out infinite alternate;
      filter: drop-shadow(0 8px 7px rgba(0,0,0,.18));
      will-change: transform;
    }

    @keyframes bounce {
      0% {
        transform: translateY(0) rotate(-5deg) scale(1);
      }

      50% {
        transform: translateY(-28px) rotate(5deg) scale(1.04);
      }

      100% {
        transform: translateY(0) rotate(-2deg) scale(.99);
      }
    }

    @keyframes roam {
      0%   { transform: translate(2vw, 72vh) scaleX(1); }
      10%  { transform: translate(16vw, 58vh) scaleX(1); }
      22%  { transform: translate(34vw, 76vh) scaleX(1); }
      36%  { transform: translate(58vw, 48vh) scaleX(1); }
      48%  { transform: translate(78vw, 68vh) scaleX(1); }
      50%  { transform: translate(78vw, 68vh) scaleX(-1); }
      62%  { transform: translate(60vw, 18vh) scaleX(-1); }
      74%  { transform: translate(38vw, 32vh) scaleX(-1); }
      88%  { transform: translate(14vw, 16vh) scaleX(-1); }
      100% { transform: translate(2vw, 72vh) scaleX(-1); }
    }


 /* =========================================================
   ZEPPO COFFEE – LINKS OBEN
   ========================================================= */

.coffee-logo {
  position: fixed;
  left: 25px;
  top: 25px;
  width: 300px;
  height: auto;
  z-index: 2;
}


/* =========================================================
   ZEPPO FROMAGE – NEBEN COFFEE
   ========================================================= */

.fromage-logo {
  position: fixed;
  left: 335px;
  top: 25px;
  width: 300px;
  height: auto;
  z-index: 2;
}


/* =========================================================
   COFFEE AWARD
   ========================================================= */

.coffee-award {
  position: fixed;
  left: 120px;
  top: 225px;
  width: 110px;
  height: auto;
  z-index: 2;
}
    /* =========================================================
       ZEPPO SPORT / ZEPPO BEER
       DREHBARES LOGO LINKS UNTEN
       ========================================================= */

    .sport-flip {
      position: fixed;
      left: 25px;
      bottom: 100px;
      width: 300px;
      height: 300px;
      z-index: 2;
      perspective: 1200px;
    }

    .sport-flip-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      animation: zeppoFlip 10s ease-in-out infinite;
    }

    .sport-logo {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .sport-logo.front {
      transform: rotateY(0deg);
    }

    .sport-logo.back {
      transform: rotateY(180deg);
    }

    @keyframes zeppoFlip {
      0% {
        transform: rotateY(0deg);
      }

      35% {
        transform: rotateY(0deg);
      }

      45% {
        transform: rotateY(180deg);
      }

      80% {
        transform: rotateY(180deg);
      }

      90% {
        transform: rotateY(360deg);
      }

      100% {
        transform: rotateY(360deg);
      }
    }


    /* =========================================================
       Z-PHARMA – RECHTS OBEN
       ========================================================= */

    .pharma-logo {
      position: fixed;
      right: 25px;
      top: 25px;
      width: 260px;
      height: auto;
      z-index: 2;
    }


    /* =========================================================
       ZEPPOMEDICA – RECHTS UNTEN
       ========================================================= */

    .zeppomedica-logo {
      position: fixed;
      right: 25px;
      bottom: 25px;
      width: 300px;
      height: auto;
      z-index: 2;
    }


    /* =========================================================
       HANDY
       ========================================================= */

    @media (max-width: 600px) {

      /* Hauptlogo */

      .logo {
        width: 72vw;
        top: 52%;
      }


      /* Coffee */

.coffee-logo {
  position: fixed;
  left: 25px;
  top: 25px;
  width: 230px;
  height: auto;
  z-index: 2;
}

.fromage-logo {
  position: fixed;
  left: 265px;
  top: 25px;
  width: 230px;
  height: auto;
  z-index: 2;
}


      /* Award */

      .coffee-award {
        left: 9vw;
        top: 105px;
        width: 58px;
      }


      /* Pharma */

      .pharma-logo {
        right: 10px;
        top: 10px;
        width: 30vw;
        max-width: 125px;
      }


      /* Sport / Beer */

      .sport-flip {
        left: 10px;
        bottom: 15px;
        width: 39vw;
        height: 39vw;
        max-width: 160px;
        max-height: 160px;
      }


      /* Medica */

      .zeppomedica-logo {
        right: 10px;
        bottom: 10px;
        width: 39vw;
        max-width: 160px;
      }


      /* Hund */

      .dog-wrap {
        width: clamp(80px, 24vw, 125px);
        animation-duration: 14s;
      }

      @keyframes roam {
        0% {
          transform: translate(2vw, 70vh) scaleX(1);
        }

        12% {
          transform: translate(18vw, 60vh) scaleX(1);
        }

        28% {
          transform: translate(48vw, 72vh) scaleX(1);
        }

        42% {
          transform: translate(68vw, 52vh) scaleX(1);
        }

        50% {
          transform: translate(68vw, 52vh) scaleX(-1);
        }

        64% {
          transform: translate(52vw, 27vh) scaleX(-1);
        }

        80% {
          transform: translate(22vw, 35vh) scaleX(-1);
        }

        100% {
          transform: translate(2vw, 70vh) scaleX(-1);
        }
      }
    }


    /* =========================================================
       BARRIEREFREIHEIT
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      .sport-flip-inner {
        animation: none;
      }

      .dog-wrap {
        animation: none;
      }

      .dog {
        animation: none;
      }

      .bubble {
        animation: none;
      }
    }

  </style>
</head>
