<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zeppolimo</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
    }

    body {
      position: relative;
    }

    .logo {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(760px, 92vw);
      height: auto;
      display: block;
      z-index: 1;
    }

    .dog-wrap {
      position: absolute;
      left: 0;
      top: 0;
      width: clamp(110px, 15vw, 210px);
      z-index: 2;
      pointer-events: none;
      animation: roam 18s linear infinite;
    }

    .dog {
      width: 100%;
      height: auto;
      display: block;
      transform-origin: 50% 90%;
      animation: bounce 0.9s ease-in-out infinite alternate;
      filter: drop-shadow(0 8px 7px rgba(0,0,0,.18));
    }

    @keyframes bounce {
      0%   { transform: translateY(0) rotate(-4deg) scaleX(1); }
      55%  { transform: translateY(-22px) rotate(4deg) scaleX(1.03); }
      100% { transform: translateY(0) rotate(-2deg) scaleX(.98); }
    }

    @keyframes roam {
      0%   { transform: translate(3vw, 72vh) scaleX(1); }
      12%  { transform: translate(18vw, 55vh) scaleX(1); }
      25%  { transform: translate(38vw, 76vh) scaleX(1); }
      38%  { transform: translate(62vw, 40vh) scaleX(1); }
      50%  { transform: translate(80vw, 68vh) scaleX(1); }
      51%  { transform: translate(80vw, 68vh) scaleX(-1); }
      64%  { transform: translate(58vw, 15vh) scaleX(-1); }
      77%  { transform: translate(33vw, 35vh) scaleX(-1); }
      90%  { transform: translate(10vw, 14vh) scaleX(-1); }
      100% { transform: translate(3vw, 72vh) scaleX(-1); }
    }

    @media (max-width: 600px) {
      .dog-wrap {
        width: clamp(95px, 27vw, 145px);
      }

      @keyframes roam {
        0%   { transform: translate(2vw, 75vh) scaleX(1); }
        15%  { transform: translate(22vw, 56vh) scaleX(1); }
        30%  { transform: translate(52vw, 74vh) scaleX(1); }
        45%  { transform: translate(70vw, 44vh) scaleX(1); }
        50%  { transform: translate(72vw, 44vh) scaleX(-1); }
        65%  { transform: translate(50vw, 14vh) scaleX(-1); }
        80%  { transform: translate(20vw, 30vh) scaleX(-1); }
        100% { transform: translate(2vw, 75vh) scaleX(-1); }
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .dog-wrap, .dog {
        animation: none;
      }
      .dog-wrap {
        left: 3vw;
        top: 72vh;
      }
    }
  </style>
</head>
<body>
  <img class="logo" src="zeppolimo-logo.jpeg" alt="Zeppolimo Logo mit Hinky und Pinky">
  <div class="dog-wrap" aria-hidden="true">
    <img class="dog" src="zeppolimo-hund.png" alt="">
  </div>
</body>
</html>
