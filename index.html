<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zeppolimo</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #e9e9e9;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      box-sizing: border-box;
    }

    img {
      display: block;
      width: min(900px, 92vw);
      height: auto;
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(0,0,0,.16);
    }
  </style>
</head>
<body>
  <img src="zeppolimo-logo.jpeg" alt="Zeppolimo Logo mit Hinky und Pinky">
</body>
</html>
